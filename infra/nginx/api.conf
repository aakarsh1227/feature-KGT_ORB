# Load balancer in front of the API replicas (docker-compose.yml).
#
# Its job is redundancy, not throughput: one container being rebuilt, crashing
# or being killed by the OOM reaper must not take every tenant's chatbot
# offline. The API is stateless as of the shared-store work
# (apps/api/src/lib/sharedStore.js), so any replica can serve any request and
# no sticky sessions are needed.

# Docker's embedded DNS. Needed because of the proxy_pass below.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 80;
  server_name _;

  # Uploads: the API accepts 25MB (MAX_UPLOAD_BYTES in
  # services/shared/fileIngest.js), plus multipart overhead. nginx's own
  # default is 1MB, which would reject a legitimate ZIP of manuals with a 413
  # before the request ever reached the app.
  client_max_body_size 30m;
  client_body_timeout 60s;

  # A chat turn waits on an LLM provider: engine/llmClient.js allows
  # LLM_TIMEOUT_MS (20s) per provider and falls through a chain of three, and a
  # website import may render pages in a headless browser. nginx's 60s default
  # would cut those off mid-flight and return 504 to a request the API was
  # still working on.
  proxy_read_timeout 180s;
  proxy_send_timeout 180s;
  proxy_connect_timeout 10s;

  location / {
    # CORS, preflight included, is owned entirely by the API
    # (apps/api/src/utils/corsPolicy.js). OPTIONS is proxied straight through
    # like any other method — nginx must NOT short-circuit it or add its own
    # Access-Control-* headers here: the app already sets exactly one
    # Access-Control-Allow-Origin per response, and a second one added at this
    # layer would make the browser reject the response as having multiple
    # values. If preflight ever fails, fix the allowlist in corsPolicy.js /
    # CORS_ORIGINS, not here.

    # A variable, deliberately, with the resolver above: nginx resolves a
    # literal `proxy_pass http://api:4000` (or an `upstream` block) ONCE at
    # startup and caches the single address it got, so every request would go
    # to whichever replica answered DNS first — two containers running and one
    # serving everything, which looks like it works right up until that one
    # dies. Resolving per request lets Docker's DNS round-robin the replicas.
    set $api_upstream http://api:4000;
    proxy_pass $api_upstream;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    # Appends this hop's peer, so the chain reaching the API is
    # "<visitor>, <anything in front of nginx>". TRUST_PROXY_HOPS in the API
    # must count every proxy in this chain, or per-IP rate limits collapse
    # into a single shared bucket — see .env.docker.example.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;

    # Don't let a replica that is shutting down fail a request that another
    # one could serve.
    proxy_next_upstream error timeout http_502 http_503 http_504;
  }

  # Kept out of the access log: the healthcheck polls it every 10s per replica.
  location = /health {
    access_log off;
    set $api_health http://api:4000;
    proxy_pass $api_health;
    proxy_set_header Host $host;
  }
}
